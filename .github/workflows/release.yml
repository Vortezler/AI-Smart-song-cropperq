name: Release

# Publishes a GitHub release with the APK attached. Runs when:
#  - a tag like v1.0.0 is pushed, or
#  - release notes under docs/releases/ land on main (the tag is v<versionName>, created here), or
#  - it's started by hand from the Actions tab.
# If the release for that tag already exists, nothing is published.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["docs/releases/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists == 'false'

      - name: Unit tests and release build
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Publish GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk="SmartMusicCropper-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then notes_arg=(--notes-file "$notes"); else notes_arg=(--generate-notes); fi
          gh release create "$TAG" "$apk" --target "$GITHUB_SHA" --title "Smart Music Cropper ${TAG}" "${notes_arg[@]}"
